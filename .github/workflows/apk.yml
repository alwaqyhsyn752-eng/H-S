name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << 'CFG'
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          CFG

      - name: Generate TWA project
        run: |
          mkdir -p build && cd build
          bubblewrap init --manifest="https://alwaqyhsyn752-eng.github.io/H-S/manifest.json" --directory=./app --skipPwaValidation || true
          ls -la app/ || ls -la ./

      - name: Build APK
        run: |
          cd build
          if [ -d "app" ]; then cd app; fi
          bubblewrap build --skipPwaValidation || bubblewrap build

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pot-awlq-apk
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 30

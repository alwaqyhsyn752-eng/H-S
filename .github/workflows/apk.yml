name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << 'CFG'
          {
            "jdkPath": "'"$JAVA_HOME"'",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          CFG
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Accept licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate TWA project
        run: |
          mkdir -p twa && cd twa
          bubblewrap init \
            --manifest="https://alwaqyhsyn752-eng.github.io/H-S/manifest.json" \
            --directory=./app \
            --skipPwaValidation || true

      - name: Build APK
        run: |
          cd twa/app 2>/dev/null || cd twa
          bubblewrap build --skipPwaValidation 2>&1 | tee build.log || true
          echo "--- البحث عن APK ---"
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pot-awlq-apk
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 30

name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Build APK with Bubblewrap
        run: |
          npm i -g @bubblewrap/cli
          mkdir -p build && cd build
          npx @bubblewrap/cli init \
            --manifest "https://alwaqyhsyn752-eng.github.io/H-S/manifest.json" \
            --directory ./app || true
          cd app 2>/dev/null || cd .
          npx @bubblewrap/cli build 2>/dev/null || true
          find . -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pot-awlq-apk
          path: build/*.apk
